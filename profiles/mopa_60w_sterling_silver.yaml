name: mopa_60w_sterling_silver
machine: "60W MOPA fiber"
lightburn_mode: "3D Sliced"
black_is_deep: true

print_width_mm: 50.0
print_height_mm: 50.0
shape: circle

# --- Reflectivity warning -----------------------------------------------
# Sterling silver (.925) is ~97% reflective at 1064 nm. The spray is only
# used for the very first breakthrough pass to break the mirror surface.
# Deep 3D sculpting relies entirely on machine geometry and MOPA settings
# — the spray vaporises within the first few depth layers.
requires_spray: true
spray_notes: >-
  Sterling silver (.925) is ~97 % reflective at 1064 nm. Apply a thin,
  even coat of anti-reflection marking spray (xTool Metal Spray, LaserBond
  100, or similar) BEFORE the breakthrough pass only. The spray breaks the
  mirror skin and is then fully vaporised within the first depth layers.
  Spray washes off with plain water. Use half-hard temper blanks — they
  resist warping under rapid thermal cycling better than dead-soft stock.

# --- Hardware setup (mandatory for deep 3D engraving) -------------------
# Back-reflection during deep 3D creates micro-smooth, highly reflective
# steps in the silver that the spray cannot protect against.
hardware_setup_notes: >-
  Bed tilt 1.5°–2° is mandatory for deep 3D engraving on silver.
  Prop up one edge of your engraving vice so the workpiece sits at a
  permanent 1.5°–2° angle relative to the laser head. At 0° the reflected
  beam returns straight up the lens column; at 1.5° it deflects 3°–4°
  into the aluminium inner housing of the lens shroud where it dissipates
  harmlessly. A 1.5° tilt across a 25 mm blank shifts focal height by
  only ~0.65 mm — well within the ±1–2 mm Rayleigh range of a 150 mm
  F-theta lens. Do NOT skip this step.

heightmap:
  near_percentile: 5
  far_percentile: 95
  gamma: 0.72
  contrast: 1.0
  midtone_boost: 0.08
  deep_limit: 0.04
  surface_limit: 0.96
  smooth: bilateral
  smooth_diameter: 9
  smooth_strength: 0.08
  sharpen: 0.2
  sharpen_sigma: 2.0
  flatten_background: true
  background_threshold: 0.88
  background_value: 1.0

# --- Breakthrough pass (STEP 1 — run with spray, separate file) ----------
# One single-pass surface scan to bond the spray and micro-rough the skin.
# The export bundle includes a standalone breakthrough.lbrn2 for this step.
breakthrough_pass:
  speed_mm_s: 400
  power_percent: 45
  frequency_khz: 45
  pulse_width_ns: 200
  line_interval_mm: 0.015

# --- Main 3D sculpt parameters (STEP 2 — project.lbrn2) -----------------
# Short pulse width (130 ns) delivers a snappy explosive punch that
# vaporises silver instantly rather than letting it pool into a mirror.
# 60 kHz sits in the sweet spot: high enough peak power to ablate cleanly,
# low enough to avoid the thermal accumulation that causes pooling.
lightburn_starting_point:
  lens: "150mm"
  speed_mm_s: 600
  power_percent: 75
  frequency_khz: 60
  pulse_width_ns: 130
  line_interval_mm: 0.015
  passes: 256
  angle_increment: 45
  cleanup_every_passes: 18

# --- Zone-based engraving (opt-in; requires zone_params in request) --------
# zone:device reuses lightburn_starting_point so subject ablation stays at
# the calibrated silver 3D-sculpt parameters. field uses high-speed annealing
# to colour the background without removing material.
zone_boundary_sigma_scale: 1.0

zone_geometry:
  border_width_mm: 1.5
  rim_width_mm: 0.5
  exergue_height_fraction: 0.18

zone_params:
  field:
    speed_mm_s: 2100
    power_percent: 32
    frequency_khz: 100
    pulse_width_ns: 185
    line_interval_mm: 0.02
    passes: 2
  border:
    speed_mm_s: 1200
    power_percent: 40
    frequency_khz: 80
    pulse_width_ns: 180
    line_interval_mm: 0.02
    passes: 4
  rim:
    speed_mm_s: 1500
    power_percent: 28
    frequency_khz: 80
    pulse_width_ns: 185
    line_interval_mm: 0.02
    passes: 2
  # device intentionally absent — falls back to lightburn_starting_point
  exergue:
    speed_mm_s: 800
    power_percent: 70
    frequency_khz: 60
    pulse_width_ns: 130
    line_interval_mm: 0.015
    passes: 128
