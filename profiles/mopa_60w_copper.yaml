name: mopa_60w_copper
machine: "60W MOPA fiber"
lightburn_mode: "3D Sliced"
black_is_deep: true

# Default print BOUNDING BOX for the .lbrn2 export — the exporter
# fits the heightmap into this area preserving aspect, so non-square
# heightmaps don't stretch. 80 × 80 mm suits the copper sheet stock
# most engravers buy (decorative panels, small signage).
print_width_mm: 80.0
print_height_mm: 80.0
shape: rectangle

# --- Reflectivity warning -----------------------------------------------
# Copper is ~96% reflective at 1064 nm — nearly as dangerous as silver.
# Always apply anti-reflection spray before firing.
requires_spray: true
spray_notes: >-
  Copper is ~96 % reflective at 1064 nm — nearly as dangerous as silver.
  Apply a thin, even coat of anti-reflection marking spray (xTool Metal
  Spray, LaserBond 100, or similar) BEFORE the breakthrough pass only.
  The spray breaks the mirror skin for the first pass; deep 3D layers
  rely on machine geometry and MOPA settings. Spray washes off with
  plain water. Use ETP or OFE copper sheet for consistent ablation.

hardware_setup_notes: >-
  Bed tilt 1.5°–2° is strongly recommended for deep 3D engraving on
  copper. At ~96 % reflectivity copper poses nearly the same back-
  reflection risk as silver during the deep sculpt phases. Prop up one
  edge of the engraving vice to deflect specular returns into the lens
  shroud rather than back up the beam column.

breakthrough_pass:
  speed_mm_s: 400
  power_percent: 40
  frequency_khz: 45
  pulse_width_ns: 200
  line_interval_mm: 0.015

heightmap:
  near_percentile: 5
  far_percentile: 95
  gamma: 0.75
  contrast: 1.02
  midtone_boost: 0.07
  deep_limit: 0.04
  surface_limit: 0.95
  smooth: bilateral
  smooth_diameter: 9
  smooth_strength: 0.08
  sharpen: 0.2
  sharpen_sigma: 2.0
  flatten_background: true
  background_threshold: 0.89
  background_value: 1.0

lightburn_starting_point:
  lens: "150mm"
  speed_mm_s: 1900
  power_percent: 90
  frequency_khz: 95
  pulse_width_ns: 190
  line_interval_mm: 0.015
  passes: 256
  angle_increment: 45
  cleanup_every_passes: 20