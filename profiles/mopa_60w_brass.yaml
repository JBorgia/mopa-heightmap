name: mopa_60w_brass
machine: "60W MOPA fiber"
lightburn_mode: "3D Sliced"
black_is_deep: true

# Default print BOUNDING BOX for the .lbrn2 export — the exporter
# scales the heightmap to fit inside this box while preserving its
# native aspect ratio (so portrait-oriented sculptok output never
# gets stretched into a square). Picked for typical 60 × 60 mm brass
# plaques and signet rings — small enough to suit the material's
# expense, larger jobs override per-export.
print_width_mm: 60.0
print_height_mm: 60.0
# Coin/medallion profiles clip the engraving to a circle in LightBurn
# using a Tool-layer Ellipse (MaskID). Set shape to rectangle for plaques.
shape: circle

# --- Reflectivity warning -----------------------------------------------
# Brass is 65–70% reflective at 1064 nm. Mirror-finish or lacquered stock
# can climb well above this — apply anti-reflection spray to be safe.
requires_spray: true
spray_notes: >-
  Brass reflectivity at 1064 nm is 65–70 %, rising above 90 % on
  mirror-polished or lacquered blanks. Apply a thin, even coat of
  anti-reflection marking spray (xTool Metal Spray, LaserBond 100, or
  similar) on any high-polish surface before firing. Spray washes off
  with plain water. Use half-hard (H02) temper sheet to resist warping.

heightmap:
  near_percentile: 5
  far_percentile: 95
  gamma: 0.72
  contrast: 1.0
  midtone_boost: 0.08
  deep_limit: 0.04
  surface_limit: 0.96
  smooth: bilateral
  smooth_diameter: 9
  smooth_strength: 0.08
  sharpen: 0.2
  sharpen_sigma: 2.0
  flatten_background: true
  background_threshold: 0.88
  background_value: 1.0

lightburn_starting_point:
  lens: "150mm"
  speed_mm_s: 2000
  power_percent: 92
  frequency_khz: 100
  pulse_width_ns: 200
  line_interval_mm: 0.025
  passes: 256
  angle_increment: 45
  cleanup_every_passes: 20