name: mopa_60w_brass
machine: "60W MOPA fiber"
lightburn_mode: "3D Sliced"
black_is_deep: true

# Default print BOUNDING BOX for the .lbrn2 export — the exporter
# scales the heightmap to fit inside this box while preserving its
# native aspect ratio (so portrait-oriented sculptok output never
# gets stretched into a square). Picked for typical 60 × 60 mm brass
# plaques and signet rings — small enough to suit the material's
# expense, larger jobs override per-export.
print_width_mm: 60.0
print_height_mm: 60.0
# Coin/medallion profiles clip the engraving to a circle in LightBurn
# using a Tool-layer Ellipse (MaskID). Set shape to rectangle for plaques.
shape: circle

# --- Reflectivity warning -----------------------------------------------
# Brass is 65–70% reflective at 1064 nm. Mirror-finish or lacquered stock
# can climb well above this — apply anti-reflection spray to be safe.
requires_spray: true
spray_notes: >-
  Brass reflectivity at 1064 nm is 65–70 %, rising above 90 % on
  mirror-polished or lacquered blanks. Apply a thin coat of anti-
  reflection marking spray (xTool Metal Spray, LaserBond 100, or similar)
  BEFORE the breakthrough pass on high-polish stock. The spray breaks the
  mirror skin; subsequent depth layers are safer due to micro-roughening.
  Spray washes off with plain water. Use half-hard (H02) temper sheet.

hardware_setup_notes: >-
  Bed tilt 1.5°–2° is recommended for mirror-polished brass during deep
  3D engraving. Standard brushed or satin-finish brass is lower risk,
  but the tilt is a zero-cost precaution on any stock with a mirror finish.

breakthrough_pass:
  speed_mm_s: 500
  power_percent: 35
  frequency_khz: 45
  pulse_width_ns: 200
  line_interval_mm: 0.015

heightmap:
  near_percentile: 5
  far_percentile: 95
  gamma: 0.72
  contrast: 1.0
  midtone_boost: 0.08
  deep_limit: 0.04
  surface_limit: 0.96
  smooth: bilateral
  smooth_diameter: 9
  smooth_strength: 0.08
  sharpen: 0.2
  sharpen_sigma: 2.0
  flatten_background: true
  background_threshold: 0.88
  background_value: 1.0

lightburn_starting_point:
  lens: "150mm"
  speed_mm_s: 2000
  power_percent: 92
  frequency_khz: 100
  pulse_width_ns: 200
  line_interval_mm: 0.015
  passes: 256
  angle_increment: 45
  cleanup_every_passes: 20
# --- Zone-based engraving (enables multi-layer .lbrn2 export) --------------
# Starting points derived from this profile's calibrated sculpt settings —
# verify with a test grid before production. zone:device intentionally
# absent: it falls back to lightburn_starting_point.
zone_boundary_sigma_scale: 1.0

zone_geometry:
  border_width_mm: 1.5
  rim_width_mm: 0.5
  exergue_height_fraction: 0.18

zone_params:
  field:
    speed_mm_s: 2500
    power_percent: 35
    frequency_khz: 120
    pulse_width_ns: 150
    line_interval_mm: 0.02
    passes: 2
  border:
    speed_mm_s: 1400
    power_percent: 45
    frequency_khz: 100
    pulse_width_ns: 180
    line_interval_mm: 0.02
    passes: 4
  rim:
    speed_mm_s: 1800
    power_percent: 30
    frequency_khz: 100
    pulse_width_ns: 160
    line_interval_mm: 0.02
    passes: 2
  exergue:
    speed_mm_s: 800
    power_percent: 85
    frequency_khz: 100
    pulse_width_ns: 200
    line_interval_mm: 0.015
    passes: 128
