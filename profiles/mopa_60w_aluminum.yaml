name: mopa_60w_aluminum
machine: "60W MOPA fiber"
lightburn_mode: "3D Sliced"
black_is_deep: true

# Default print BOUNDING BOX for the .lbrn2 export — the exporter
# fits the heightmap inside this box while preserving its native
# aspect ratio (so a portrait heightmap on a 100 mm square blank
# renders ~75 × 100 mm rather than being stretched square). Sized
# for a typical 100 × 100 mm aluminium signage / nameplate blank.
print_width_mm: 100.0
print_height_mm: 100.0
shape: rectangle

# --- Reflectivity warning -----------------------------------------------
# Polished aluminium is 88–92% reflective at 1064 nm; anodised stock is
# much lower. Spray mirror-finish blanks before firing.
requires_spray: true
spray_notes: >-
  Polished aluminium is 88–92 % reflective at 1064 nm. Anodised or
  brushed surfaces are safer, but if you are using bare, mirror-finish
  sheet, apply a thin coat of anti-reflection marking spray (xTool Metal
  Spray, LaserBond 100, or similar) before firing. Spray washes off with
  plain water. Hard-anodised (Type III) aluminium needs no spray and
  engraves cleanly without it.

heightmap:
  near_percentile: 6
  far_percentile: 94
  gamma: 0.68
  contrast: 1.08
  midtone_boost: 0.1
  deep_limit: 0.05
  surface_limit: 0.95
  smooth: bilateral
  smooth_diameter: 9
  smooth_strength: 0.09
  sharpen: 0.22
  sharpen_sigma: 2.0
  flatten_background: true
  background_threshold: 0.86
  background_value: 1.0

lightburn_starting_point:
  lens: "150mm"
  speed_mm_s: 2200
  power_percent: 88
  frequency_khz: 80
  pulse_width_ns: 180
  line_interval_mm: 0.03
  passes: 220
  angle_increment: 45
  cleanup_every_passes: 18